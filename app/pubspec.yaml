name: myhato
description: My Hatō — phones, accessories & phone repair. YOUR PHONE. OUR PRIORITY.
publish_to: "none"
version: 1.0.0+59

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.6.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  intl: any
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  mobile_scanner: ^7.0.0
  uuid: ^4.4.2
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  intl_phone_field: ^3.2.0
  crypto: ^3.0.3
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_local_notifications: ^18.0.1
  excel: ^4.0.6
  archive: ^3.6.1
  file_picker: ^8.1.2
  local_auth: ^2.3.0
  record: ^6.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  flutter_secure_storage: ^9.2.2
  ffi: ^2.1.3
  image: ^4.2.0
  camera: ^0.11.0
  camera_windows: ^0.2.6
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.1.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/google_fonts/
    # face models: filled only by the Windows build (build-windows.yml), empty everywhere else
    - assets/face/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "assets/brand/icon_bg.png"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"

flutter_native_splash:
  color: "#071C3A"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#071C3A"
    image: assets/brand/splash_logo.png
