name: myhato
description: My Hatō — phones, accessories & phone repair. YOUR PHONE. OUR PRIORITY.
publish_to: "none"
version: 1.0.0+38

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.6.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  intl: any
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.0
  uuid: ^4.4.2
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#0B2D5B"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"

flutter_native_splash:
  color: "#0B2D5B"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#0B2D5B"
    image: assets/brand/splash_logo.png
