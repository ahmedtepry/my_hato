# Compile check only (no release, no APK): `flutter analyze`. Start it by pushing the branch `analyze-check`.
name: Analyze app
on:
  push:
    branches: [analyze-check]
permissions:
  contents: read
concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          if grep -E "^\s*error •" /tmp/analyze.txt; then echo "::error::analyzer found errors"; exit 1; fi
