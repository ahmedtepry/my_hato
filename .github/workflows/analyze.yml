# Compile check only (no release, no APK): `flutter analyze`. Start it by pushing the branch `analyze-check`.
name: Analyze app
on:
  push:
    branches: [analyze-check]
permissions:
  contents: read
concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          if grep -E "^\s*error •" /tmp/analyze.txt; then
            grep -E "^\s*error •" /tmp/analyze.txt | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::analyzer found errors"; exit 1
          fi
      - name: Home layout widget tests
        working-directory: app
        continue-on-error: true
        run: |
          flutter test test/home_layouts_test.dart test/team_panels_test.dart 2>&1 | tee /tmp/t.txt || true
          grep -E "EXCEPTION CAUGHT|Expected:|Actual:|first build:|toggle to|\[E\]|Some tests failed|All tests passed" /tmp/t.txt | head -40 | while IFS= read -r l; do echo "::warning::HL $l"; done
          grep -A12 "EXCEPTION CAUGHT" /tmp/t.txt | head -60 | while IFS= read -r l; do echo "::warning::HX $l"; done
