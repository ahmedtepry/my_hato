# Compile check only (no release, no APK): `flutter analyze`. Start it by pushing the branch `analyze-check`.
name: Analyze app
on:
  push:
    branches: [analyze-check]
permissions:
  contents: read
concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          if grep -E "^\s*error •" /tmp/analyze.txt; then
            grep -E "^\s*error •" /tmp/analyze.txt | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::analyzer found errors"; exit 1
          fi
      - name: Home layout widget tests
        working-directory: app
        run: |
          set +e
          flutter test test/home_layouts_test.dart test/team_panels_test.dart test/welcome_robot_test.dart > /tmp/t.txt 2>&1
          RC=$?
          echo "::warning::HL rc=$RC $(tr '\r' '\n' < /tmp/t.txt | grep -v '^$' | tail -2 | tr '\n' '~' | cut -c1-400)"
          echo "::warning::HL $(grep -E 'Some tests failed|All tests passed' /tmp/t.txt | tail -1)"
          echo "::warning::HX $(grep -v '^$' /tmp/t.txt | grep -A40 -m1 'EXCEPTION CAUGHT' | tr '\n' '~' | cut -c1-3500)"
          echo "::warning::HY $(grep -v '^$' /tmp/t.txt | grep -E 'ON SCREEN|Error|error|Exception' | head -12 | tr '\n' '~' | cut -c1-3500)"
          exit $RC
