# Builds the Windows TEAM app (console only, no customer store): an installer (.exe) and a zip, published as a GitHub release "team-win-N".
# Start it by pushing the branch `windows-build` (or manually from the Actions tab once this file is on main).
name: Build Windows team app
on:
  workflow_dispatch:
  push:
    branches: [windows-build]   # push this branch to start a build (workflow_dispatch needs the file on main)
permissions:
  contents: write
concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build Windows app
        working-directory: app
        shell: bash
        run: |
          exec > >(tee ../build-win.log) 2>&1
          flutter --version
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.myhato --project-name myhato .
          rm -f test/widget_test.dart
          # local_auth_windows uses the old <experimental/coroutine>, which the newest Visual Studio rejects unless silenced
          sed -i '/^project(/a add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' windows/CMakeLists.txt
          mkdir -p assets/google_fonts
          for w in Regular Medium Bold ExtraBold Black; do
            curl -sSfL "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-$w.ttf" -o "assets/google_fonts/Tajawal-$w.ttf" || echo "WARN: Tajawal-$w failed"
          done
          for w in Regular Medium SemiBold Bold ExtraBold Black; do
            curl -sSfL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf" -o "assets/google_fonts/Poppins-$w.ttf" || echo "WARN: Poppins-$w failed"
          done
          flutter pub get
          # window title + app icon (non-fatal)
          sed -i 's/L"myhato"/L"My Hato Team"/' windows/runner/main.cpp || true
          # open maximised (full screen of the work area)
          sed -i 's/SW_SHOWNORMAL/SW_SHOWMAXIMIZED/' windows/runner/win32_window.cpp || true
          (pip install pillow >/dev/null 2>&1 && python tool/windows/make_ico.py) || echo "WARN: icon step failed"
          flutter build windows --release \
            --dart-define=TEAM_ONLY=true \
            --dart-define=SUPABASE_URL=https://efdomvgypdkpqubkkjwm.supabase.co \
            --dart-define=APP_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmZG9tdmd5cGRrcHF1YmtrandtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NjUzMjMsImV4cCI6MjEwODI0MTMyM30.EcvDTYBNfh2bka7UUA7gdcK12e8y4DnvOcIuGRmI4dg
          REL=build/windows/x64/runner/Release
          ls "$REL"
          # the Visual C++ runtime, so it also starts on a clean Windows
          for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$d" "$REL/" || echo "WARN: $d not copied"; done
      - name: Installer (.exe) and zip
        working-directory: app
        run: |
          mkdir -p ../dist
          choco install innosetup -y --no-progress || echo "WARN: innosetup install failed"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ -f "$ISCC" ]; then
            (cd tool/windows && "$ISCC" installer.iss) && cp tool/windows/out/MyHatoTeam-Setup.exe ../dist/MyHatoTeam-Setup.exe
          else
            echo "WARN: Inno Setup not found, only the zip will be published"
          fi
          powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath '../dist/MyHatoTeam-windows.zip' -Force"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        continue-on-error: true # the release below is the real delivery; GitHub's artifact storage quota can be full
        with:
          name: myhato-team-windows
          path: dist/*
          if-no-files-found: error
      - name: Publish as a GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "team-win-${{ github.run_number }}" dist/* --target "${{ github.sha }}" \
            --title "My Hatō Team for Windows (build ${{ github.run_number }})" \
            --notes "Windows team app: console only, sign in with a team account. Run MyHatoTeam-Setup.exe (or unzip MyHatoTeam-windows.zip and run myhato.exe)." \
            --latest=false
      # Publishes the installer for the in-app "update" button (the app downloads it, checks its SHA-256 and installs it).
      # Not fatal: a failure here never blocks the release above.
      - name: Publish the in-app update
        continue-on-error: true
        env:
          PUSH_SECRET: ${{ secrets.UPDATE_PUSH_SECRET }}
        run: |
          FN=https://efdomvgypdkpqubkkjwm.supabase.co/functions/v1/app-update
          FILE=dist/MyHatoTeam-Setup.exe
          BUILD=${{ github.run_number }}
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s | head -c 280)
          PREP=$(curl -sS -X POST "$FN" -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" -d "{\"action\":\"prepare\",\"platform\":\"windows\",\"build\":$BUILD}")
          echo "prepare: ${PREP:0:120}"
          URL=$(echo "$PREP" | python -c "import sys,json;print(json.load(sys.stdin)['url'])")
          curl -sS -f -X PUT "$URL" -H "Content-Type: application/octet-stream" -H "x-upsert: true" --data-binary @"$FILE"
          BODY=$(python -c "import json,sys;print(json.dumps({'action':'publish','platform':'windows','build':int(sys.argv[1]),'sha256':sys.argv[2],'notes':sys.argv[3]}))" "$BUILD" "$SHA" "$NOTES")
          curl -sS -f -X POST "$FN" -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" -d "$BODY"
      - name: Publish build log to ci-logs-win branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs && (cp build-win.log /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log)
          echo "run=${{ github.run_number }} sha=${{ github.sha }} result=${{ job.status }}" > /tmp/logs/meta.txt
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-win
          git rm -rf --cached . -q
          rm -rf logs && cp -r /tmp/logs logs
          git add -f logs && git commit -qm "windows build log #${{ github.run_number }}"
          git push -f origin ci-logs-win
