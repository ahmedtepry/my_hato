name: quick-login-check
on:
  push:
    branches: [quick-login-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: call staff-quick-login
        run: |
          URL=https://efdomvgypdkpqubkkjwm.supabase.co/functions/v1/staff-quick-login
          echo "bad key:"; curl -sS -X POST $URL -H 'content-type: application/json' -d '{"keys":["zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"]}'; echo
          echo "test key (fingerprint mode):"
          curl -sS -X POST $URL -H 'content-type: application/json' -d "{\"keys\":[\"ci-test-key-0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d\"]}" | python3 -c "import sys,json; r=json.load(sys.stdin); print({k:(('<%d chars>'%len(v)) if k=='token_hash' else v) for k,v in r.items()})"
