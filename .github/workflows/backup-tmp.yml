name: Backup cleanup (temporary)
on:
  push:
    branches: [backup-tmp]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --repo ${{ github.repository }} -L 200 --json tagName -q '.[].tagName' | grep '^backup-tmp-'); do gh release delete "$t" --repo ${{ github.repository }} --cleanup-tag -y; done
