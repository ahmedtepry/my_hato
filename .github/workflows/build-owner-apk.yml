# Builds the "MyHato Owner" Android app (AI chat for the owner) and publishes it as release "owner-N".
# Start it by pushing the branch `owner-apk-build` (or from the Actions tab once this file is on main).
name: Build owner APK
on:
  workflow_dispatch:
  push:
    branches: [owner-apk-build]
permissions:
  contents: write
concurrency:
  group: owner-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64_2: ${{ secrets.ANDROID_KEYSTORE_BASE64_2 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: bash app/tool/ci_build_owner.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        continue-on-error: true # the release below is the real delivery; GitHub's artifact quota can be full
        with: { name: myhato-owner-apk, path: dist/MyHatoOwner.apk, if-no-files-found: ignore }
      - name: Publish release
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="owner-${{ github.run_number }}"
          for i in 1 2 3; do
            gh release create "$TAG" dist/MyHatoOwner.apk --target "${{ github.sha }}" --title "MyHato Owner (build ${{ github.run_number }})" \
              --notes "The owner's AI chat app. Download MyHatoOwner.apk and open it on Android." && exit 0
            sleep 10
          done
          exit 1
      - name: Publish the in-app update (owner app)
        if: success()
        continue-on-error: true
        env:
          PUSH_SECRET: ${{ secrets.UPDATE_PUSH_SECRET }}
        run: |
          if [ ! -f dist/stable-key.flag ]; then echo "temporary key: not offered as an update"; exit 0; fi
          FN=https://efdomvgypdkpqubkkjwm.supabase.co/functions/v1/app-update
          FILE=dist/MyHatoOwner.apk
          BUILD=${{ github.run_number }}
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          PREP=$(curl -sS -X POST "$FN" -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" -d "{\"action\":\"prepare\",\"platform\":\"android_owner\",\"build\":$BUILD}")
          URL=$(echo "$PREP" | python3 -c "import sys,json;print(json.load(sys.stdin)['url'])")
          curl -sS -f -X PUT "$URL" -H "Content-Type: application/octet-stream" -H "x-upsert: true" --data-binary @"$FILE"
          NOTES=$(git log -1 --pretty=%s | head -c 280)
          BODY=$(python3 -c "import json,sys;print(json.dumps({'action':'publish','platform':'android_owner','build':int(sys.argv[1]),'sha256':sys.argv[2],'notes':sys.argv[3]}))" "$BUILD" "$SHA" "$NOTES")
          curl -sS -f -X POST "$FN" -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" -d "$BODY"
