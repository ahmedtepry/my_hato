# Google Play build: a signed Android App Bundle (.aab) with the in-app updater switched off (Play updates the app).
# Run manually: Actions -> Build Play AAB -> Run workflow. Download from the run's Artifacts (myhato-play-aab).
name: Build Play AAB
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build release AAB
        env:
          STORE_BUILD: "1"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: bash app/tool/ci_build.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: myhato-play-aab
          path: dist/myhato-release.aab
          if-no-files-found: error
