name: db-migrate
# One-off: copies the MyHato database (roles, schema, auth users, data) from the restricted project to the new one.
# Passwords are one-time values that are rotated right after the run.
on:
  workflow_dispatch:
    inputs:
      old_ref: { required: true, type: string }
      new_ref: { required: true, type: string }
      old_pw: { required: true, type: string }
      new_pw: { required: true, type: string }
      step: { required: true, type: string, default: "all" }
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask
        run: |
          echo "::add-mask::${{ inputs.old_pw }}"
          echo "::add-mask::${{ inputs.new_pw }}"
      - name: Find poolers
        id: p
        run: |
          set +e
          pick(){ ref=$1; pw=$2; us=$3
            for h in aws-0-eu-central-1 aws-1-eu-central-1 aws-0-eu-west-1 aws-1-eu-west-1 aws-0-eu-west-2 aws-1-eu-west-2 aws-0-us-east-1 aws-1-us-east-1 aws-0-eu-central-2 aws-1-eu-central-2 aws-0-ap-south-1 aws-1-ap-south-1; do
              u="postgresql://$us.$ref:$pw@$h.pooler.supabase.com:5432/postgres"
              if PGCONNECT_TIMEOUT=8 psql "$u" -tAc "select 1" >/dev/null 2>&1; then echo "$h"; return; fi; done; echo none; }
          o=$(pick ${{ inputs.old_ref }} ${{ inputs.old_pw }} migrator); n=$(pick ${{ inputs.new_ref }} ${{ inputs.new_pw }} postgres)
          for h in aws-0-eu-central-1 aws-1-eu-central-1; do PGCONNECT_TIMEOUT=8 psql "postgresql://postgres.${{ inputs.new_ref }}:${{ inputs.new_pw }}@$h.pooler.supabase.com:5432/postgres" -tAc "select 1" 2>&1 | sed "s/^/new $h: /" | head -3; done
          echo "old pooler: $o  new pooler: $n"; echo "old=$o" >> $GITHUB_OUTPUT; echo "new=$n" >> $GITHUB_OUTPUT
          [ "$o" != none ] && [ "$n" != none ]
      - name: Dump and restore
        env:
          OLD: postgresql://migrator.${{ inputs.old_ref }}:${{ inputs.old_pw }}@${{ steps.p.outputs.old }}.pooler.supabase.com:5432/postgres
          NEW: postgresql://postgres.${{ inputs.new_ref }}:${{ inputs.new_pw }}@${{ steps.p.outputs.new }}.pooler.supabase.com:5432/postgres
        run: |
          set -e
          PG="docker run --rm -i --network host -v $PWD:/w -w /w postgres:17"
          # extensions first (they live in the extensions schema)
          $PG psql "$NEW" -v ON_ERROR_STOP=1 -c "create extension if not exists pg_trgm with schema extensions; create extension if not exists vector with schema extensions; create extension if not exists pg_cron; create extension if not exists \"uuid-ossp\" with schema extensions; create extension if not exists pgcrypto with schema extensions;"
          # schema of public (tables, functions, policies, triggers, grants)
          $PG pg_dump "$OLD" --schema-only -n public --no-owner -f schema.sql
          sed -i -E '/^CREATE SCHEMA public;/d; /^COMMENT ON SCHEMA public /d' schema.sql
          grep -n 'DEFAULT PRIVILEGES FOR ROLE' schema.sql | grep -v 'FOR ROLE postgres ' | cut -c1-140 || true
          sed -i -E '/^ALTER DEFAULT PRIVILEGES FOR ROLE (supabase_admin|supabase_auth_admin|supabase_storage_admin|pgsodium_keymaker)/d' schema.sql
          # policies on storage.objects and triggers on auth/storage tables written by us
          $PG psql "$OLD" -tAX -v ON_ERROR_STOP=1 -f - > extra.sql <<'SQL'
          select format('create policy %I on %I.%I as %s for %s to %s%s%s;', policyname, schemaname, tablename, permissive, cmd, array_to_string(roles, ','),
                 case when qual is not null then ' using ('||qual||')' else '' end, case when with_check is not null then ' with check ('||with_check||')' else '' end)
          from pg_policies where schemaname in ('storage');
          select pg_get_triggerdef(t.oid)||';' from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace
          where not t.tgisinternal and n.nspname in ('auth','storage') and pg_get_triggerdef(t.oid) ilike '%public.%';
          select format('alter publication supabase_realtime add table %I.%I;', schemaname, tablename) from pg_publication_tables where pubname='supabase_realtime' and schemaname='public';
          SQL
          # data: public + auth users/identities + storage buckets
          $PG pg_dump "$OLD" --data-only -n public -f data_public.sql
          $PG pg_dump "$OLD" --data-only -t auth.users -t auth.identities -t storage.buckets -f data_sys.sql
          wc -c schema.sql extra.sql data_public.sql data_sys.sql
          grep -c "^COPY" data_public.sql || true
          $PG psql "$NEW" -v ON_ERROR_STOP=1 --single-transaction -f schema.sql
          echo "schema ok"
          $PG psql "$NEW" -v ON_ERROR_STOP=0 -f extra.sql 2>&1 | tail -20
          $PG psql "$NEW" -v ON_ERROR_STOP=1 --single-transaction -c "SET session_replication_role = replica" -f data_sys.sql -f data_public.sql
          echo "data ok"
          $PG psql "$NEW" -tAc "select count(*) from pg_tables where schemaname='public'; select count(*) from auth.users; select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';"
          rm -f *.sql
