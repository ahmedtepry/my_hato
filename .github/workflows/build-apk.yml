# Builds a signed RELEASE APK on every push to main (or manually from the Actions tab).
# Download: Actions → latest run → Artifacts → myhato-release-apk.
# Optional secrets for a permanent signing key: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# The full build log is pushed to the `ci-logs` branch (logs/build.log).
name: Build release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash   # explicit bash => pipefail, so a failed build fails the job
        run: bash app/tool/ci_build.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: myhato-release-apk
          path: dist/myhato-release.apk
          if-no-files-found: ignore
      - name: Publish APK as a GitHub release (direct download on the phone)
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER=$(grep -m1 '^version:' app/pubspec.yaml | awk '{print $2}')
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/myhato-release.apk --target "${{ github.sha }}" \
            --title "My Hatō ${VER} (build ${{ github.run_number }})" \
            --notes "Release APK built from ${{ github.sha }}. Install on Android: download myhato-release.apk and open it (allow installing from this source)." \
            --latest
      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && (cp build.log /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log)
          echo "run=${{ github.run_number }} sha=${{ github.sha }} result=${{ job.status }}" > /tmp/logs/meta.txt
          cp app/test/goldens/*.png /tmp/logs/ 2>/dev/null || true
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          rm -rf logs && cp -r /tmp/logs logs
          [ -f dist/myhato-release.apk ] && mkdir -p apk && cp dist/myhato-release.apk apk/
          git add -f logs $( [ -d apk ] && echo apk ) && git commit -qm "build log #${{ github.run_number }}"
          git push -f origin ci-logs
