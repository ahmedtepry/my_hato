# Builds a signed RELEASE APK on every push to main (or manually from the Actions tab).
# Download: Actions → latest run → Artifacts → myhato-release-apk.
# Optional secrets for a permanent signing key: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# The full build log is pushed to the `ci-logs` branch (logs/build.log).
name: Build release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64_2: ${{ secrets.ANDROID_KEYSTORE_BASE64_2 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash   # explicit bash => pipefail, so a failed build fails the job
        run: bash app/tool/ci_build.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        continue-on-error: true # the release below is the real delivery; GitHub's artifact storage quota can be full
        with:
          name: myhato-release-apk
          path: dist/myhato-release.apk
          if-no-files-found: ignore
      - name: Publish APK as a GitHub release (direct download on the phone)
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER=$(grep -m1 '^version:' app/pubspec.yaml | awk '{print $2}')
          TAG="build-${{ github.run_number }}"
          ls -la dist || true
          for i in 1 2 3; do
            if gh release create "$TAG" dist/myhato-release.apk --target "${{ github.sha }}" \
                 --title "My Hatō ${VER} (build ${{ github.run_number }})" \
                 --notes "Release APK built from ${{ github.sha }}. Install on Android: download myhato-release.apk and open it (allow installing from this source)." \
                 --latest 2> release_err.txt; then
              exit 0
            fi
            echo "::warning::release attempt $i failed: $(tr '\n' ' ' < release_err.txt)"
            sleep 10
          done
          echo "::error::release failed: $(tr '\n' ' ' < release_err.txt)"
          exit 1
      # Publishes the APK for the in-app "update" banner (the app downloads it, checks its SHA-256 and hands it to Android).
      # Only when the build was signed with the permanent key (a temporary key can't install over the installed app). Not fatal.
      - name: Publish the in-app update
        if: success()
        continue-on-error: true
        env:
          PUSH_SECRET: ${{ secrets.UPDATE_PUSH_SECRET }}
        run: |
          if [ ! -f dist/stable-key.flag ]; then echo "temporary signing key: not offering this build as an in-app update"; exit 0; fi
          FN=https://efdomvgypdkpqubkkjwm.supabase.co/functions/v1/app-update
          FILE=dist/myhato-release.apk
          BUILD=${{ github.run_number }}
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s | head -c 280)
          PREP=$(curl -sS -X POST "$FN" -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" -d "{\"action\":\"prepare\",\"platform\":\"android\",\"build\":$BUILD}")
          echo "prepare: ${PREP:0:120}"
          URL=$(echo "$PREP" | python3 -c "import sys,json;print(json.load(sys.stdin)['url'])")
          curl -sS -f -X PUT "$URL" -H "Content-Type: application/octet-stream" -H "x-upsert: true" --data-binary @"$FILE"
          BODY=$(python3 -c "import json,sys;print(json.dumps({'action':'publish','platform':'android','build':int(sys.argv[1]),'sha256':sys.argv[2],'notes':sys.argv[3]}))" "$BUILD" "$SHA" "$NOTES")
          curl -sS -f -X POST "$FN" -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" -d "$BODY"
      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && (cp build.log /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log)
          echo "run=${{ github.run_number }} sha=${{ github.sha }} result=${{ job.status }}" > /tmp/logs/meta.txt
          cp app/test/goldens/*.png /tmp/logs/ 2>/dev/null || true
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          rm -rf logs && cp -r /tmp/logs logs
          [ -f dist/myhato-release.apk ] && mkdir -p apk && cp dist/myhato-release.apk apk/
          git add -f logs $( [ -d apk ] && echo apk ) && git commit -qm "build log #${{ github.run_number }}"
          git push -f origin ci-logs
