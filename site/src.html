  --ok:#1C8A4E; --warn:#B4610B; --star:#E8A317; --ph:#E3EDF8;

  --fl:'Poppins','Tajawal',system-ui,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06152A; --surface:#0C2240; --ink:#E7F0FA; --muted:#9DB1CB; --line:#1C3A60; --chip:#123056;
  --blue:#4FA8F5; --blue-ink:#8CC8FF; --ok:#46C483; --warn:#F0A453; --ph:#11294A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06152A; --surface:#0C2240; --ink:#E7F0FA; --muted:#9DB1CB; --line:#1C3A60; --chip:#123056;
  --blue:#4FA8F5; --blue-ink:#8CC8FF; --ok:#46C483; --warn:#F0A453; --ph:#11294A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;margin:0}
html[lang=en] body{font-family:var(--fl)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{width:38px;height:38px;border-radius:10px}
.brand b{font-family:var(--fl);font-weight:700;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.brand b span{color:var(--wave)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;padding-inline:44px 14px;font:inherit;font-size:15px}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search svg{position:absolute;inset-inline-start:14px;top:12px;width:20px;height:20px;opacity:.75}
.tbtn{height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;padding-inline:14px;font-weight:600;flex:none}
.getbtn{display:inline-flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--wave);color:var(--navy);padding-inline:16px;font-weight:800;text-decoration:none;flex:none;border:0}
.getbtn svg{width:20px;height:20px}
@media (max-width:720px){
  .top .wrap{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%}
  .brand{margin-inline-end:auto}
  .getbtn .lbl-long{display:none}
  .tbtn{padding-inline:10px}
  .getbtn{padding-inline:12px}
  .brand b{font-size:18px}
}

.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;padding-block:44px 52px}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.15;margin:0 0 14px;font-weight:800;text-wrap:balance}
.hero p{font-size:18px;color:#D4E6F8;margin:0 0 26px;max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.big-get{display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--navy);border-radius:16px;padding:12px 22px 12px 18px;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.big-get svg{width:30px;height:30px;flex:none}
.big-get small{display:block;font-size:12.5px;color:#4B5E78;font-weight:500}
.big-get strong{display:block;font-size:19px;font-weight:800;line-height:1.2}
.ver{font-size:13.5px;color:#BCD6F0}
.ios-note{font-size:13.5px;color:#FFD9A8;margin-top:12px}
.phone{justify-self:center;width:min(260px,70vw);aspect-ratio:9/18.5;border-radius:36px;background:#061a35;border:8px solid #13345f;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.phone .bar{display:flex;align-items:center;gap:8px;padding:14px 12px 10px;background:var(--navy-2)}
.phone .bar img{width:26px;height:26px;border-radius:7px}
.phone .bar b{font-family:var(--fl);font-size:14px}
.phone .bar b span{color:var(--wave)}
.phone .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;flex:1;align-content:start}
.phone .t{background:#0E2C55;border-radius:12px;overflow:hidden}
.phone .t .im{aspect-ratio:1;background:#163b6c}
.phone .t .im img{width:100%;height:100%;object-fit:cover;display:block}
.phone .t div.n{font-size:10px;padding:5px 7px 0;color:#D4E6F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .t div.p{font-size:11px;padding:0 7px 7px;font-weight:700;color:var(--wave)}

.promise{background:var(--surface);border-bottom:1px solid var(--line)}
.promise .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:18px}
.pr{display:flex;gap:12px;align-items:flex-start}
.pr svg{width:28px;height:28px;flex:none;color:var(--blue)}
.pr b{display:block;font-size:15.5px}
.pr span{font-size:14px;color:var(--muted)}

.cat{flex:none;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding-inline:16px;font-weight:600;font-size:14.5px;white-space:nowrap}
.cat[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .cat[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06152A}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.im{aspect-ratio:1;background:var(--ph);position:relative;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue)}
.im .ph svg{width:38%;height:38%;opacity:.8}
.card .b{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .n{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.price{font-family:var(--fl);font-weight:700;font-size:17px;color:var(--blue-ink);font-variant-numeric:tabular-nums}
.price small{font-size:12px;font-weight:600;margin-inline-start:3px}
.tag{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.tag.out{background:var(--warn)}
.empty{padding:40px 0;color:var(--muted);text-align:center}

.stars{color:var(--star);letter-spacing:1px}

.buy-note{font-size:13.5px;color:var(--muted);margin:8px 0 22px;text-align:center}
.svc{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.svc .r{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.svc .r+.r{border-top:1px solid var(--line)}
.svc svg{width:24px;height:24px;color:var(--blue);flex:none;margin-top:2px}
.svc b{display:block;font-size:15.5px}
.svc span{font-size:14px;color:var(--muted)}
details{border-top:1px solid var(--line);padding-block:14px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:"+";font-size:22px;color:var(--muted)}
details[open] summary::after{content:"–"}
details p,details dl{margin:10px 0 0;color:var(--ink);max-width:65ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px}
dt{color:var(--muted)}
dd{margin:0;font-family:var(--fl);font-variant-numeric:tabular-nums}
.more{margin-top:40px}

/* get the app */
.getapp{background:var(--surface);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;margin-top:36px}

.getapp h2{font-size:26px}
.getapp p{color:var(--muted);margin:0 0 18px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--blue-ink);display:grid;place-items:center;font-weight:800;font-family:var(--fl)}
.steps b{display:block}
.steps span{font-size:14.5px;color:var(--muted)}
.dl2{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:14px;height:54px;padding-inline:22px;font-weight:800;font-size:17px;text-decoration:none}
:root[data-theme="dark"] .dl2{background:var(--blue);color:#06152A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dl2{background:var(--blue);color:#06152A}}
.dl2 svg{width:22px;height:22px}
.meta{font-size:13.5px;color:var(--muted);margin-top:10px;font-family:var(--fl)}

footer{background:var(--navy);color:#C9DCF2;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-block:22px}
footer a{color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 tagp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V3h9l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>'
};
// one simple drawing per category, shown while a photo loads or if it can't load
const GLYPH={
 cases:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><circle cx="10" cy="6" r="1.2"/>',
 'screen-protectors':'<rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M9 6l6 6M9 10l4 4"/>',
 chargers:'<path d="M8 3v4M16 3v4"/><rect x="6" y="7" width="12" height="7" rx="2"/><path d="M12 14v4a3 3 0 0 0 3 3"/>',
 cables:'<path d="M7 3v5M17 16v5"/><rect x="5" y="8" width="4" height="4" rx="1"/><rect x="15" y="12" width="4" height="4" rx="1"/><path d="M7 12c0 6 10 0 10 0"/>',
 headphones:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
 speakers:'<rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7" r="1"/>',
 holders:'<rect x="8" y="2.5" width="8" height="13" rx="1.5"/><path d="M12 15.5V20M8 21h8"/>',
 gaming:'<rect x="2.5" y="7" width="19" height="10" rx="5"/><path d="M7 10v4M5 12h4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>',
 'watch-accessories':'<rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l1-4h4l1 4M9 18l1 4h4l1-4"/>',
 bundles:'<path d="M3 8l9-5 9 5-9 5-9-5ZM3 8v8l9 5 9-5V8M12 13v8"/>',
 'other-accessories':'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>'
};
const ph=c=>`<div class="ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${GLYPH[c]||GLYPH['other-accessories']}</svg></div>`;
const img=(p,i=0,w=600)=>{const u=p.imgs[i];return `<div class="im">${ph(p.c)}${u?`<img src="${sized(u,w)}" alt="" loading="lazy" onload="this.previousElementSibling.hidden=true" onerror="this.remove()">`:''}</div>`};
const sized=(u,w)=>u.includes('images.unsplash.com')?u.replace(/w=\d+&h=\d+/,`w=${w}&h=${w}`):u;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=m=>`${(m/100).toLocaleString('en-US',{maximumFractionDigits:2})}<small>${t('egp')}</small>`;

// data: start from the saved copy, then refresh from the store's live catalogue
let DATA={cats:SNAP.c.map(([s,a,e])=>({s,a,e})),
  prods:SNAP.p.map(([s,c,a,e,da,de,pr,st,r,rc,f,ims])=>({s,c,a,e,da,de,pr,st,r,rc,f,imgs:ims.map(id=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=900&h=900&q=80`)})),
  build:SNAP.build,path:SNAP.path,size:SNAP.size,url:SNAP.url||null};
// GitHub Releases: free downloads (Supabase Storage downloads count against the Free plan)
const apkUrl=()=>DATA.url||`${SUPA}/storage/v1/object/public/app-updates/${DATA.path}?download=MyHato.apk`;

async function live(){
  const h={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
  const ctl=new AbortController();setTimeout(()=>ctl.abort(),7000);
  try{
    const [u,ps,cs]=await Promise.all([
      fetch(`${SUPA}/rest/v1/rpc/latest_android_update`,{method:'POST',headers:h,body:'{}',signal:ctl.signal}).then(r=>r.ok?r.json():null),
      fetch(`${SUPA}/rest/v1/products?status=eq.published&select=slug,name_ar,name_en,description_ar,description_en,price_minor,stock_quantity,rating_avg,rating_count,is_featured,sold_count,category:categories(slug),product_images(storage_path,sort_order)&order=is_featured.desc,sold_count.desc&limit=500`,{headers:h,signal:ctl.signal}).then(r=>r.ok?r.json():null),
      fetch(`${SUPA}/rest/v1/categories?is_active=eq.true&parent_id=is.null&select=slug,name_ar,name_en&order=sort_order`,{headers:h,signal:ctl.signal}).then(r=>r.ok?r.json():null)
    ]);
    const up=Array.isArray(u)?u[0]:u;
    if(up&&up.path){DATA.build=up.build;DATA.path=up.path;DATA.size=up.size_bytes;DATA.url=up.url||null}
    if(Array.isArray(ps)&&ps.length){
      DATA.prods=ps.map(p=>({s:p.slug,c:p.category?.slug||'other-accessories',a:p.name_ar,e:p.name_en||p.name_ar,da:p.description_ar||'',de:p.description_en||p.description_ar||'',
        pr:p.price_minor,st:p.stock_quantity,r:+p.rating_avg||0,rc:p.rating_count||0,f:p.is_featured?1:0,
        imgs:(p.product_images||[]).sort((x,y)=>x.sort_order-y.sort_order).map(i=>/^https?:/.test(i.storage_path)?i.storage_path:`${SUPA}/storage/v1/object/public/product-images/${i.storage_path}`)}));
      if(Array.isArray(cs)){const used=new Set(DATA.prods.map(p=>p.c));DATA.cats=cs.filter(c=>used.has(c.slug)).map(c=>({s:c.slug,a:c.name_ar,e:c.name_en||c.name_ar}))}
    }
    render();
  }catch(e){/* offline or blocked: keep the saved copy */}
}

const nm=p=>L==='ar'?p.a:p.e, ds=p=>L==='ar'?p.da:p.de, cn=c=>c?(L==='ar'?c.a:c.e):'';
let cat='',q='';

function dlButton(){
  const mb=Math.round((DATA.size||0)/1048576);
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  return `<div class="cta"><a class="big-get" href="${apkUrl()}" target="_blank" rel="noopener">${ICONS.android}<span><small>${t('dlSmall')}</small><strong>${t('dlBig')}</strong></span></a>
    <span class="ver">${t('ver')(DATA.build,mb)}</span></div>${ios?`<div class="ios-note">${t('ios')}</div>`:''}`;
}
function getApp(){
  const mb=Math.round((DATA.size||0)/1048576);
  return `<section class="getapp" id="get-app-box">
    <div><h2>${t('gaT')}</h2><p>${t('gaP')}</p>
      <a class="dl2" href="${apkUrl()}" target="_blank" rel="noopener">${ICONS.dl}${t('dlBig')}</a>
      <div class="meta">${t('ver')(DATA.build,mb)}</div></div>
    <ol class="steps">
      <li><div><b>${t('st1')}</b><span>${t('st1s')}</span></div></li>
      <li><div><b>${t('st2')}</b><span>${t('st2s')}</span></div></li>
      <li><div><b>${t('st3')}</b><span>${t('st3s')}</span></div></li>
    </ol></section>`;
}
const card=p=>`<a class="card" href="#p-${esc(p.s)}">${img(p).replace('</div>',p.st<=0?`</div><span class="tag out">${t('out')}</span>`:'</div>')}
  <div class="b"><div class="n">${esc(nm(p))}</div><div class="price">${money(p.pr)}</div></div></a>`;

function home(){
  const top=DATA.prods.filter(p=>p.f).slice(0,4);
  const mini=(top.length?top:DATA.prods).slice(0,4).map(p=>`<div class="t">${img(p,0,300).replace('class="im"','class="im"')}<div class="n">${esc(nm(p))}</div><div class="p">${money(p.pr)}</div></div>`).join('');
  return `<section class="hero"><canvas id="waves" aria-hidden="true"></canvas><div class="wrap">
    <div><h1>${t('h1')}</h1><p>${t('hp')}</p>${dlButton()}</div>
    <div class="phone" aria-hidden="true"><div class="bar"><img src="${ICON}" alt=""><b>My <span>Hatō</span></b></div><div class="grid">${mini}</div></div>
  </div></section>
  <section class="promise"><div class="wrap">
    <div class="pr">${ICONS.truck}<div><b>${t('p1')}</b><span>${t('p1s')}</span></div></div>
    <div class="pr">${ICONS.wrench}<div><b>${t('p2')}</b><span>${t('p2s')}</span></div></div>
    <div class="pr">${ICONS.tagp}<div><b>${t('p3')}</b><span>${t('p3s')}</span></div></div>
  </div></section>
  <main class="wrap" id="shop"><h2>${t('shop')}</h2>
    <div class="cats" role="group">${[{s:'',a:t('all'),e:t('all')},...DATA.cats].map(c=>`<button class="cat" type="button" data-cat="${esc(c.s)}" aria-pressed="${c.s===cat}">${esc(cn(c))}</button>`).join('')}</div>
    <div id="list"></div>
    ${getApp()}
  </main>`;
}
function list(){
  const el=document.getElementById('list');if(!el)return;
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const ps=DATA.prods.filter(p=>(!cat||p.c===cat)&&words.every(w=>(p.a+' '+p.e+' '+p.s).toLowerCase().includes(w)));
  el.innerHTML=ps.length?`<div class="grid">${ps.map(card).join('')}</div>`:`<div class="empty">${t('none')}</div>`;
}
function product(slug){
  const p=DATA.prods.find(x=>x.s===slug);
  if(!p)return home();
  const c=DATA.cats.find(x=>x.s===p.c);
  const stars=p.rc?'★'.repeat(Math.round(p.r))+'☆'.repeat(5-Math.round(p.r)):'☆☆☆☆☆';
  const stock=p.st<=0?`<div class="stock no">${t('out')}</div>`:p.st<=10?`<div class="stock ok">${t('low')(p.st)}</div>`:`<div class="stock ok">${t('instock')}</div>`;
  const rel=DATA.prods.filter(x=>x.c===p.c&&x.s!==p.s).slice(0,4);
  return `<main class="wrap">
    <nav class="crumbs"><a href="#">${t('home')}</a><span>/</span><a href="#c-${esc(p.c)}">${esc(cn(c))}</a><span>/</span><span>${esc(nm(p))}</span></nav>
    <div class="pdp">
      <div class="gal"><div id="main-im">${img(p,0,900)}</div>
        ${p.imgs.length>1?`<div class="thumbs">${p.imgs.map((u,i)=>`<button type="button" data-i="${i}" aria-current="${i===0}" aria-label="${i+1}">${img(p,i,160)}</button>`).join('')}</div>`:''}</div>
      <div class="det">
        <h1>${esc(nm(p))}</h1>
        <p class="sub">${esc(ds(p))}</p>
        <div class="rate"><span class="stars" aria-hidden="true">${stars}</span><span>${p.rc?(+p.r).toFixed(1)+' ':''}${t('rev')(p.rc)}</span></div>
        <div class="price">${money(p.pr)}</div>
        ${stock}
        <a class="buy" href="${apkUrl()}" target="_blank" rel="noopener">${ICONS.dl}${t('buy')}</a>
        <div class="buy-note">${t('buyNote')}</div>
        <div class="svc">
          <div class="r">${ICONS.truck}<div><b>${t('s1')}</b><span>${t('s1s')}</span></div></div>
          <div class="r">${ICONS.store}<div><b>${t('s2')}</b><span>${t('s2s')}</span></div></div>
          <div class="r">${ICONS.wrench}<div><b>${t('s3')}</b><span>${t('s3s')}</span></div></div>
        </div>
        <details open><summary>${t('desc')}</summary><p>${esc(ds(p))}</p></details>
        <details><summary>${t('spec')}</summary><dl><dt>${t('sku')}</dt><dd>${esc(p.s.toUpperCase())}</dd><dt>${t('cat')}</dt><dd>${esc(cn(c))}</dd></dl></details>
      </div>
    </div>
    ${rel.length?`<section class="more"><h2>${t('rel')}</h2><div class="grid">${rel.map(card).join('')}</div></section>`:''}
    ${getApp()}
  </main>`;
}

function waves(){
  const cv=document.getElementById('waves');if(!cv)return;
  const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  cv.width=r.width*d;cv.height=r.height*d;const g=cv.getContext('2d');g.scale(d,d);
  const W=r.width,H=r.height;
  for(let i=0;i<34;i++){
    g.beginPath();g.strokeStyle=`rgba(120,190,255,${0.08+i*0.006})`;g.lineWidth=1;
    for(let x=0;x<=W;x+=8){
      const y=H*0.62+Math.sin(x/W*Math.PI*1.6+i*0.09)*(H*0.16)+i*3.2-Math.cos(x/W*Math.PI)*20;
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
}

function applyLang(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.getElementById('q').placeholder=t('ph');
  document.getElementById('lang').textContent=innerWidth<480?(L==='ar'?'EN':'ع'):(L==='ar'?'English':'عربي');
}
function render(){
  applyLang();
  const h=location.hash.slice(1);
  const v=document.getElementById('view');
  if(h.startsWith('p-')){v.innerHTML=product(h.slice(2));}
  else{
    if(h.startsWith('c-'))cat=h.slice(2);else if(!h||h==='get-app')cat=cat;
    v.innerHTML=home();list();waves();
  }
  if(h==='get-app'){document.getElementById('get-app-box')?.scrollIntoView({block:'center'})}
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.cat');
  if(c){cat=c.dataset.cat;document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',b===c));list();return}
  const th=e.target.closest('.thumbs button');
  if(th){const slug=location.hash.slice(3);const p=DATA.prods.find(x=>x.s===slug);if(!p)return;
    document.getElementById('main-im').innerHTML=img(p,+th.dataset.i,900);
    document.querySelectorAll('.thumbs button').forEach(b=>b.setAttribute('aria-current',b===th));}
});
document.getElementById('q').addEventListener('input',e=>{
  q=e.target.value;
  if(location.hash.startsWith('#p-')){location.hash='shop';}
  list();
});
document.getElementById('lang').addEventListener('click',()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('mh_lang',L)}catch(e){}render()});
addEventListener('hashchange',()=>{render();if(location.hash.startsWith('#p-'))scrollTo(0,0)});
addEventListener('resize',()=>{clearTimeout(window._w);window._w=setTimeout(waves,150)});
document.getElementById('yr').textContent=new Date().getFullYear();
render();live();
</script>
